services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: firewall
      POSTGRES_USER: firewall
      POSTGRES_PASSWORD: firewall
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firewall -d firewall"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: firewall
      POSTGRES_USER: firewall
      POSTGRES_PASSWORD: firewall
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LLM_ENABLED: "false"
    ports:
      - "8000:8000"

volumes:
  pgdata:
